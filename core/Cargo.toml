[package]
name = "rest_commands"
version = "0.1.0"
description = "REST_Commands: Execute arbitrary commands via REST"
authors = ["Tyler Moore"]
license = ""
repository = ""
default-run = "rest_commands"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
shell-words = "1"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
#hyper-services = { path = "../../trm-rust-libs/hyper-services" } #for development
##hyper-services = { git = "file:///home/tyler/repos/trm-rust-libs" } #for local git nix build, not used in this project
hyper-services = { git = "https://github.com/overtone1000/trm-rust-libs" } #use git for allow building remotely